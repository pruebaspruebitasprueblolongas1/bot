name: Bot Visitas Gratis

on:
  workflow_dispatch: # Te permite darle a un botón en GitHub para ejecutarlo cuando quieras

jobs:
  run-bot:
  runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Bot Masivo
        run: python bot.py
