name: Bot Visitas Continuo

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Bot Masivo
        run: python bot.py

      - name: Recargar automáticamente al terminar
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Bot Visitas Continuo
          token: ${{ secrets.GITHUB_TOKEN }}
